on:
  push:
    branches:
      - main
  workflow_dispatch:
 
permissions:
  contents: read
  pages: write
  id-token: write
 
concurrency:
  group: github-pages
  cancel-in-progress: true
 
jobs:
  check:
    name: check
    runs-on: ubuntu-latest
    steps:
      - name: Lay ma nguon
        uses: actions/checkout@v4
 
      - name: Kiem tra cac file website
        run: |
          test -f index.html
          test -f style.css
          test -f script.js
          grep -qi '<title>.*</title>' index.html
          echo "Kiem tra website thanh cong!"
 
  deploy:
    name: deploy
    needs: check
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Lay ma nguon
        uses: actions/checkout@v4
 
      - name: Cau hinh GitHub Pages
        uses: actions/configure-pages@v5
 
      - name: Dong goi website
        uses: actions/upload-pages-artifact@v3
        with:
          path: .
 
      - name: Trien khai website
        id: deployment
        uses: actions/deploy-pages@v4
